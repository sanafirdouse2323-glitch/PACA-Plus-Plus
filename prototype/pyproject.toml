[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paca-mvp"
version = "0.1.0"
description = "Research MVP for testing action-bound authorization and guarded effects"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
production = [
  "PyJWT[crypto]==2.15.1",
  "psycopg[binary]==3.3.6",
  "cryptography==50.0.2",
]

[project.scripts]
paca-gateway = "paca_mvp.serve:main"
paca-ops = "paca_mvp.ops:main"
