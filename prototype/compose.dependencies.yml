# Supporting services only. The PACA++ application runs on the host and binds to
# loopback by default. Do not expose the OPA management API or database publicly.
services:
  opa:
    image: openpolicyagent/opa:1.21.4
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/authz.rego"]
    volumes:
      - ./policies:/policies:ro
    ports:
      - "127.0.0.1:8181:8181"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: paca
      POSTGRES_USER: paca
      POSTGRES_PASSWORD: ${PACA_POSTGRES_PASSWORD:?Set PACA_POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paca -d paca"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  paca_pgdata:
