services:
  paca-gateway:
    build:
      context: ../..
      dockerfile: agent/security_harness/Dockerfile.gateway
    environment:
      PACA_TLS_CERT_FILE: /run/paca-certs/server.crt
      PACA_TLS_KEY_FILE: /run/paca-certs/server.key
    volumes:
      - ${PACA_HARNESS_CERT_DIR:?set by run.sh}/server.crt:/run/paca-certs/server.crt:ro
      - ${PACA_HARNESS_CERT_DIR:?set by run.sh}/server.key:/run/paca-certs/server.key:ro
      - ./fixtures/secret.txt:/srv/paca-protected/secret.txt:ro
    networks:
      - agent_gateway
      - effect_backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8443),2); s.close()"
      interval: 2s
      timeout: 3s
      retries: 20
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m

  protected-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paca_effect_worker
      POSTGRES_PASSWORD: harness-only-not-agent
      POSTGRES_DB: protected_effects
    networks:
      - effect_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paca_effect_worker -d protected_effects"]
      interval: 2s
      timeout: 3s
      retries: 20

  downstream-api:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/srv"]
    networks:
      - effect_backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  agent-host:
    build:
      context: ../..
      dockerfile: agent/security_harness/Dockerfile.agent-host
    environment:
      PACA_BASE_URL: https://paca-gateway:8443
      SSL_CERT_FILE: /run/paca-certs/server.crt
    depends_on:
      paca-gateway:
        condition: service_healthy
    volumes:
      - ${PACA_HARNESS_CERT_DIR:?set by run.sh}/server.crt:/run/paca-certs/server.crt:ro
    networks:
      - agent_gateway
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m

networks:
  agent_gateway:
    internal: true
  effect_backend:
    internal: true
