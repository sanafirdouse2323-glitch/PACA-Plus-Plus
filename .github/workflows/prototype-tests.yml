name: PACA++ prototype checks

on:
  push:
    branches:
      - main
      - prototype/full-design-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run demonstration
        run: python examples/demo.py
      - name: Run deterministic scenarios
        run: python experiments/run_experiments.py
