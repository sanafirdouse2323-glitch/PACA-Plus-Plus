name: PACA++ prototype and hardening checks
# Includes OIDC signature, trusted-context, policy-rollover, and real OPA tests.

on:
  push:
    branches:
      - main
      - prototype/full-design-mvp
      - hardening/opa-durable-enforcement
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-prototype:
    runs-on: ubuntu-latest
    env:
      PACA_TEST_POSTGRES_DSN: postgresql://paca:paca-test-only-password@localhost:5432/paca_test
    services:
      postgres:
        image: postgres@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: paca
          POSTGRES_PASSWORD: paca-test-only-password
          POSTGRES_DB: paca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paca -d paca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and JWT verification dependency
        run: python -m pip install -e ".[web,test]"
      - name: Run unit and adversarial integration tests
        run: python -m unittest discover -s tests -v
      - name: Run legacy MVP demonstration
        run: python examples/demo.py
      - name: Exercise legacy JSON-policy CLI
        run: python examples/authorize.py --policy examples/policy.json --context examples/context.json --action file.read --resource file:report-1 --execute
      - name: Run deterministic scenarios
        run: python experiments/run_experiments.py
      - name: Validate Rego policy with pinned OPA
        run: docker run --rm -v "$GITHUB_WORKSPACE/prototype/policies:/policies:ro" openpolicyagent/opa@sha256:22a9db16423b94d2acbd4a94da3bebeb79583ed6a52ac15cad459d3de2dbbc4d check --strict /policies/paca.rego
      - name: Start real OPA for decision API integration test
        run: |
          docker run -d --name paca-opa -p 127.0.0.1:8181:8181 \
            -v "$GITHUB_WORKSPACE/prototype/policies:/policies:ro" \
            openpolicyagent/opa@sha256:22a9db16423b94d2acbd4a94da3bebeb79583ed6a52ac15cad459d3de2dbbc4d run --server --addr=0.0.0.0:8181 /policies/paca.rego
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8181/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs paca-opa
          exit 1
      - name: Exercise real OPA permit and deny decisions
        run: python examples/opa_smoke.py
      - name: Clean up OPA test service
        if: always()
        run: docker rm -f paca-opa || true
