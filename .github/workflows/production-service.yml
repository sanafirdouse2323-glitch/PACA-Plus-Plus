name: PACA++ production-service checks

on:
  push:
    branches:
      - main
      - audit/paca-consistency-runtime-safety
      - security/oauth-service-token-lifecycle
  pull_request:
    branches:
      - main
      - integration/langgraph-paca-gateway

permissions:
  contents: read

jobs:
  python-and-postgres:
    runs-on: ubuntu-latest
    env:
      PACA_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paca_test
      PACA_TEST_DATABASE_URL: postgresql://paca_runtime:paca_test_runtime_password@localhost:5432/paca_test
      PACA_TENANT_CONTEXT_HMAC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PACA_TENANT_CONTEXT_KEY_ID: v1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paca_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production_service/pyproject.toml
      - name: Install service and LangGraph integration test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "production_service[dev]"
          python -m pip install -r agent/requirements-langgraph.txt
      - name: Test the host-side PACA++ client
        run: python -m pytest agent/tests -q
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Validate local Compose configuration from the example environment
        run: docker compose --env-file production_service/.env.example -f production_service/compose.yaml config -q
      - name: Initialize schema and least-privilege runtime role
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f production_service/paca_service/schema.sql
          # Seed an intentionally over-privileged membership to exercise the
          # existing-role hardening performed by the real bootstrap script.
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE paca_test_inherited CREATEDB;
          CREATE ROLE paca_runtime LOGIN PASSWORD 'temporary-test-password';
          GRANT paca_test_inherited TO paca_runtime;
          SQL
          PGHOST=localhost PGPORT=5432 PGPASSWORD=postgres \
            POSTGRES_USER=postgres POSTGRES_DB=paca_test \
            PACA_RUNTIME_PASSWORD=paca_test_runtime_password \
            bash production_service/db-init/000-runtime-role.sh
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -Atq -v ON_ERROR_STOP=1 \
            -c "SELECT NOT pg_has_role('paca_runtime', 'paca_test_inherited', 'MEMBER') AS inherited_membership_revoked" \
            | grep -qx t
          # Simulate a legacy direct database grant and runtime ownership of the
          # private signing-key objects. Bootstrap and schema reapplication must
          # remove the grant and restore trusted ownership before key provisioning.
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE paca_test TO paca_runtime;
          GRANT CREATE ON DATABASE paca_test TO PUBLIC;
          ALTER SCHEMA paca_private OWNER TO paca_runtime;
          ALTER TABLE paca_private.tenant_context_keys OWNER TO paca_runtime;
          SQL
          PGHOST=localhost PGPORT=5432 PGPASSWORD=postgres \
            POSTGRES_USER=postgres POSTGRES_DB=paca_test \
            PACA_RUNTIME_PASSWORD=paca_test_runtime_password \
            bash production_service/db-init/000-runtime-role.sh
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -Atq -v ON_ERROR_STOP=1 \
            -c "SELECT NOT has_database_privilege('paca_runtime', current_database(), 'CREATE') AS database_create_revoked" \
            | grep -qx t
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f production_service/paca_service/schema.sql
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -Atq -v ON_ERROR_STOP=1 \
            -c "SELECT r.rolname <> 'paca_runtime' FROM pg_namespace n JOIN pg_roles r ON r.oid = n.nspowner WHERE n.nspname = 'paca_private'" \
            | grep -qx t
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -Atq -v ON_ERROR_STOP=1 \
            -c "SELECT r.rolname <> 'paca_runtime' FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace JOIN pg_roles r ON r.oid = c.relowner WHERE n.nspname = 'paca_private' AND c.relname = 'tenant_context_keys'" \
            | grep -qx t
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f production_service/paca_service/runtime_grants.sql
          # Simulate a legacy migration that left the recovery function owned
          # by the runtime role. Reapplying grants must transfer ownership back.
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON SCHEMA public TO paca_runtime;
          ALTER FUNCTION public.paca_mark_stale_executions_unknown(integer) OWNER TO paca_runtime;
          REVOKE CREATE ON SCHEMA public FROM paca_runtime;
          SQL
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f production_service/paca_service/runtime_grants.sql
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v context_key_id="$PACA_TENANT_CONTEXT_KEY_ID" \
            -v context_key="$PACA_TENANT_CONTEXT_HMAC_KEY" <<'SQL'
          INSERT INTO paca_private.tenant_context_keys (key_id, key_material, enabled)
          VALUES (:'context_key_id', decode(:'context_key', 'hex'), TRUE)
          ON CONFLICT (key_id) DO UPDATE
          SET key_material = EXCLUDED.key_material, enabled = TRUE;
          SQL
      - name: Reapply schema, grants and key provisioning to exercise upgrade idempotency
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Simulate the database-upgrade path against an already initialized
          # database. This must preserve existing data and restore the intended
          # restricted runtime privileges on repeated application.
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f production_service/paca_service/schema.sql
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f production_service/paca_service/runtime_grants.sql
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v context_key_id="$PACA_TENANT_CONTEXT_KEY_ID" \
            -v context_key="$PACA_TENANT_CONTEXT_HMAC_KEY" <<'SQL'
          INSERT INTO paca_private.tenant_context_keys (key_id, key_material, enabled)
          VALUES (:'context_key_id', decode(:'context_key', 'hex'), TRUE)
          ON CONFLICT (key_id) DO UPDATE
          SET key_material = EXCLUDED.key_material, enabled = TRUE;
          SQL
          psql "$PACA_TEST_ADMIN_DATABASE_URL" -Atq -v ON_ERROR_STOP=1 \
            -c "SELECT NOT has_function_privilege('paca_runtime', 'public.paca_mark_stale_executions_unknown(integer)', 'EXECUTE') AS runtime_recovery_denied" \
            | grep -qx t
      - name: Lint service code
        run: ruff check production_service
      - name: Run service unit and least-privilege PostgreSQL integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/production_service
        run: pytest production_service/tests -q
      - name: Start pinned OPA for real decision-client smoke test
        run: |
          set -euo pipefail
          docker run -d --name paca-opa-test -p 127.0.0.1:8181:8181 \
            -v "$GITHUB_WORKSPACE/production_service/opa:/bundle:ro" \
            openpolicyagent/opa:1.21.3@sha256:22a9db16423b94d2acbd4a94da3bebeb79583ed6a52ac15cad459d3de2dbbc4d \
            run --server --addr=0.0.0.0:8181 --log-format=json /bundle
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8181/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs paca-opa-test
            exit 1
          fi
      - name: Verify real OPA allow, default-deny revision and readiness probe
        run: |
          PYTHONPATH=production_service python - <<'PY'
          from paca_service.opa import OPAClient

          revision = "paca-dev-2026-10-23"
          client = OPAClient(
              "http://127.0.0.1:8181",
              "/v1/data/paca/authz/decision",
              revision,
              timeout_seconds=2,
          )
          try:
              # /readyz uses a deny-by-default decision; a deny must still carry revision.
              client.health()
              allowed = client.evaluate({
                  "principal": {
                      "id": "alice", "tenant_id": "t1", "roles": [],
                      "scopes": ["file:read"], "tools": [],
                  },
                  "action": "file.read",
                  "resource": {
                      "id": "f1", "tenant_id": "t1", "owner_id": "alice",
                      "kind": "file", "status": "active", "attributes": {},
                  },
                  "arguments": {},
              })
              assert allowed.allowed is True, allowed
              assert allowed.policy_revision == revision, allowed
              denied = client.evaluate({
                  "principal": {
                      "id": "alice", "tenant_id": "t1", "roles": [],
                      "scopes": [], "tools": [],
                  },
                  "action": "dangerous.exec",
                  "resource": {
                      "id": "f1", "tenant_id": "t1", "owner_id": "alice",
                      "kind": "file", "status": "active", "attributes": {},
                  },
                  "arguments": {},
              })
              assert denied.allowed is False, denied
              assert denied.reason == "default_deny", denied
              assert denied.policy_revision == revision, denied
          finally:
              client.close()
          print("Real OPA client smoke test passed.")
          PY
      - name: Start a real Keycloak OIDC provider for end-to-end identity validation
        run: |
          set -euo pipefail
          docker run -d --name paca-keycloak-test \
            -p 127.0.0.1:8081:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_ENABLED=true \
            -e KC_HOSTNAME=http://localhost:8081 \
            -v "$GITHUB_WORKSPACE/production_service/tests/identity/keycloak-realm.json:/opt/keycloak/data/import/paca-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8.1 start-dev --import-realm
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/realms/paca/.well-known/openid-configuration >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs paca-keycloak-test
            exit 1
          fi
      - name: Verify real OIDC discovery, signed tokens, authorization, execution and isolation
        env:
          PACA_TEST_OIDC_REALM_URL: http://localhost:8081/realms/paca
          PACA_TEST_OPA_URL: http://127.0.0.1:8181
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/production_service
        run: pytest production_service/tests/test_oidc_integration.py -q
      - name: Clean up Keycloak OIDC test provider
        if: always()
        run: docker rm -f paca-keycloak-test || true
      - name: Clean up OPA test service
        if: always()
        run: docker rm -f paca-opa-test || true
      - name: Start and verify the full local Compose stack
        run: |
          set -euo pipefail
          docker compose --env-file production_service/.env.example -f production_service/compose.yaml up --build --wait
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/healthz
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/readyz
      - name: Tear down local Compose stack without deleting persistent volumes
        if: always()
        run: docker compose --env-file production_service/.env.example -f production_service/compose.yaml down

  opa-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check and test Rego policy with pinned OPA
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/production_service/opa:/policies:ro" \
            openpolicyagent/opa:1.21.3@sha256:22a9db16423b94d2acbd4a94da3bebeb79583ed6a52ac15cad459d3de2dbbc4d \
            test --bundle /policies -v
