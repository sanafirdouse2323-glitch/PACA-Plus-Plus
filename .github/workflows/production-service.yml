name: PACA++ production-service checks

on:
  push:
    branches:
      - main
      - production/phase-1-security-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-and-postgres:
    runs-on: ubuntu-latest
    env:
      PACA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paca_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paca_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production_service/pyproject.toml
      - name: Install service and test dependencies
        run: python -m pip install -e "production_service[dev]"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Initialize test schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d paca_test -v ON_ERROR_STOP=1 -f production_service/paca_service/schema.sql
      - name: Lint service code
        run: ruff check production_service
      - name: Run service unit and integration tests
        run: pytest production_service/tests -q

  opa-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check and test Rego policy
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/production_service/opa:/policies:ro" \
            openpolicyagent/opa:1.21.3 test --bundle /policies -v
