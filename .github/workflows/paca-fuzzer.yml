name: PACA++ compiler regression checks

on:
  push:
    branches:
      - main
      - production/phase-1-security-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compiler-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --upgrade pip lark-parser
      - name: Run compiler regression tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p "test_fuzzer.py" -v
