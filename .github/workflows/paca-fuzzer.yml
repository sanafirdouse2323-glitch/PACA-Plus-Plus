name: PACA++ Semantic Equivalence Fuzzer

on:
  push:
    branches: [ main ]

jobs:
  differential-fuzzing:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies for Clingo & Cedar
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake bison re2c

    - name: Install PACA++ Framework Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest lark-parser clingo cedarpy

    - name: Run Differential Fuzzer
      run: |
        python paca_core.py