name: PACA++ LangGraph adapter checks

on:
  push:
    branches:
      - integration/langgraph-paca-gateway
  pull_request:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/langgraph-agent.yml"

permissions:
  contents: read

jobs:
  langgraph-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-langgraph.txt
      - name: Install pinned LangGraph integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements-langgraph.txt
      - name: Compile the agent package
        run: python -m compileall -q agent
      - name: Run actual LangGraph adapter tests
        run: python -m pytest agent/langgraph_tests -q
