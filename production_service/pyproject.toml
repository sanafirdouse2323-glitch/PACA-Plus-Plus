[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "paca-authorization-service"
version = "0.1.0"
description = "Production-oriented authorization service integrating OPA, verified JWTs, PostgreSQL, and effect adapters"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["paca_service*"]

[tool.setuptools.package-data]
paca_service = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
