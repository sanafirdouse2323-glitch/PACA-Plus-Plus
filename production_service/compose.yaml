services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paca
      POSTGRES_USER: paca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - paca-db:/var/lib/postgresql/data
      - ./paca_service/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paca -d paca"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [control-plane]
    security_opt: ["no-new-privileges:true"]

  opa:
    image: openpolicyagent/opa:1.21.3
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-format=json", "/policies"]
    volumes:
      - ./opa/policies:/policies:ro
      - ./opa/data.json:/policies/data.json:ro
    restart: unless-stopped
    networks: [control-plane]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PACA_DATABASE_URL: postgresql://paca:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/paca
      PACA_OPA_URL: http://opa:8181
      PACA_FILE_ROOT: /var/lib/paca/files
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - paca-files:/var/lib/paca/files
    depends_on:
      database:
        condition: service_healthy
      opa:
        condition: service_started
    restart: unless-stopped
    networks: [control-plane, outbound]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  control-plane:
    internal: true
  outbound: {}

volumes:
  paca-db:
  paca-files:
